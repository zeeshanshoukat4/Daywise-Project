function ist(x,T){const B=ibase(x);if(!B.s)return{k:'np',v:0};if(x.nt)return{k:'na',v:0,P0:B.s,P1:B.e||B.s};
 const P0=B.s,rng=RNG(x)&&!!B.e&&B.e>B.s,P1=rng?B.e:B.s,o={P0,P1,rng};
 if(!rng){if(x.as){const v=dd(x.as,P0);return{...o,k:v>0?'late':'ok',v,done:1}}
  if(T>P0)return{...o,k:'od',v:dd(T,P0)};return{...o,k:dd(P0,T)<=7?'due':'pend',v:0}}
 if(x.af){const v=dd(x.af,P1);return{...o,k:v>0?'late':'ok',v,done:1}}
 if(T>P1)return{...o,k:'od',v:dd(T,P1)};
 if(x.as)return{...o,k:'prog',v:0};
 if(T>P0)return{...o,k:'ls',v:dd(T,P0)};

function actR(a,T){const rs=a.items.map(x=>ist(x,T)).filter(r=>r.k!='np'&&r.k!='na'),n=rs.length,dn=rs.filter(r=>r.done).length;let k='pend';
 if(n&&dn==n)k=rs.some(r=>r.k=='late')?'late':'ok';else for(const p of PRI)if(rs.some(r=>r.k==p)){k=p;break}
 return{n,dn,k,pc:n?Math.round(dn/n*100):0}}
function ISUM(T){const L=[];S.acts.forEach((a,i)=>a.items.forEach((x,j)=>{const r=ist(x,T);if(r.k!='np'&&r.k!='na')L.push({a,i,x,j,r})}));

 const dueL=L.filter(o=>o.r.P1<=T),done=c.ok+c.late,pc=L.length?Math.round(done/L.length*100):0,plannedPc=L.length?Math.round(dueL.length/L.length*100):0;

 return{L,c,due:dueL.length,done,pc,plannedPc,adh,h,why,dl,nx,noAct:!L.some(o=>o.x.as)}}

function setA(i,j,f,v){const x=S.acts[i].items[j],T=SD(),B=ibase(x),rng=RNG(x)&&!!B.e&&B.e>B.s;
 if(f=='plan'){x.as=B.s;if(rng)x.af=B.e}
 else if(f=='today'){if(rng){if(!x.as)x.as=mnd(B.s,T);x.af=T}else x.as=T}
 else if(f=='start'){x.as=T}
 else if(f=='clr'){x.as='';x.af='';x.rs=''}
 else if(f=='as'){x.as=v;if(!v)x.af='';else if(x.af&&x.af<v)x.af=v}
